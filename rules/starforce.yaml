# 스타포스 규칙 (초안) — 조회일 2026-10-18
# 원칙: 공식 출처에서 직접 확인한 수치만 기재. 확인 못 한 것은 TODO.
#
# [중요 경고] 2026-03-19 업데이트로 "스타캐치 삭제, 스타캐치 성공 시 올라가던 성공 확률은 항상 적용"으로 변경됨.
#   출처: https://m.maplestory.nexon.com/News/Update/799  (강화 개편 항목)
#   아래 15~29성 표는 2025-03-13 테스트월드 공지 값이며, 2026-03 개편 후에도 동일한지
#   공식 문서에서 확인하지 못했다. (스타캐치 보정 포함 여부 불명) → 확정 전 게임 내 강화 UI와 대조 필요.

version: draft-2026-10-18

# 장비 레벨별 최대 스타포스
# 출처: https://maplestory.nexon.com/Guide/N23GameInformation/Articles/412
max_star_by_level:
  - { level_min: 0,   level_max: 94,  max_star: 5 }
  - { level_min: 95,  level_max: 107, max_star: 8 }
  - { level_min: 108, level_max: 117, max_star: 10 }
  - { level_min: 118, level_max: 127, max_star: 15 }
  - { level_min: 128, level_max: 137, max_star: 20 }
  - { level_min: 138, level_max: null, max_star: 30 }   # null = 상한 없음(138 이상)

# 구간 규칙
# 출처: https://maplestory.nexon.com/Guide/N23GameInformation/Articles/412
rules:
  fail_never_drops_star: true         # 모든 단계에서 실패해도 단계 하락 없음 ("하락 방지 구간: 모든 단계")
  destroy_possible_from_star: 15      # 14성 이하는 파괴 없음, 15성 이상 파괴 가능
  destroy_guard_available_stars: [15, 16, 17]   # 파괴 방지 설정 가능 구간(현행 가이드 기준)
  # 파괴 방지 "추가" 비용 = 기본 메소의 200% (기본 비용에 더해 별도 소모 → 총 3배. 포크 코드도 base + base*2)
  # 출처(테스트월드 2025-03-13 "파괴 방지 비용 100%→200%"): https://maplestory.nexon.com/testworld/news/update/88
  # 주의: "추가 비용"이라는 해석(총 3배)은 공지 문구 + 포크 코드로 추정한 것. 게임 내 UI로 확인 필요.
  destroy_guard_extra_cost_multiplier: 2.0
  # 슈페리얼 장비는 별도 규칙(하락 방지 없음, 파괴 방지 불가, 5성부터 파괴 가능, 최대 성 수 상이)
  # 출처: https://maplestory.nexon.com/Guide/N23GameInformation/Articles/412
  # TODO: 슈페리얼 장비 성공/파괴 확률표 — 출처 미확인. V1에서 제외 권장.

