# 스타캐치: 포크는 성공확률 ×1.05 (나머지 확률은 비례 축소)로 모델링. 2026-03-19에 스타캐치가 삭제되고
# "상승분이 항상 적용"으로 바뀌었으므로, 현행 표시 확률이 base 인지 base×1.05 인지 공식 미확인 → 결정 필요.
starcatch_success_multiplier: 1.05   # source_grade: community, 현행 적용 여부 미확인

# 강화 1회 기본 메소 비용 — 비공식(포크 mgj96/megaValue 의 getCosts, 원본 kurateh/mesulive, AGPL-3.0).
# 식은 데이터가 아니라 코드이므로 src/starforce.ts 의 getCosts 한 곳에만 둔다(중복 방지). 여기에는 두지 않음.
# 공식 공지의 "17~19성, 21성 비용 증가"와 방향은 일치하지만 수치 대조는 못 했다.
# 파괴 방지 시 추가 비용 = 기본 비용의 200% (위 destroy_guard_extra_cost_multiplier).
# 할인(MVP/PC방)은 V1에서 가정하지 않는다(공식 확인은 PC방 5%뿐).
meso_cost:
  source_grade: community
  implemented_in: src/starforce.ts#getCosts

