    epic_to_unique: 1.9608
    unique_to_legendary: 0.7000
  # 같은 페이지의 "에디셔널 잠재능력 재설정" 열은 별도 수단(큐브 아님): 2.3810 / 0.9804 / 0.7000

# 등급 상승 보장 횟수 (재설정 방식별·등급별 저장, 월드 내 캐릭터 간 공유 — 블랙 페이지 주석)
pity:
  red:        { rare_to_epic: 25, epic_to_unique: 83,  unique_to_legendary: 500 }   # .../cube/red
  black:      { rare_to_epic: 10, epic_to_unique: 42,  unique_to_legendary: 107 }   # .../cube/black
  additional: { rare_to_epic: 31, epic_to_unique: 76,  unique_to_legendary: 214 }   # .../cube/addi (에디셔널/화이트 에디셔널 큐브)
  # 프라임 큐브는 레전드리 전용이라 등급 상승/보장 대상 아님 (.../cube/black 주석)

# 2·3번째 옵션이 "현재 등급과 같은 등급 풀"에서 나올 확률 (%). 나머지는 한 단계 낮은 등급 풀("노멀" 행 = 100 - 값)
# 첫 번째 옵션은 항상 100% 현재 등급.
option_slot_same_grade:
  red:      { second: 10.0000, third: 1.0000 }     # .../cube/red   (등급 무관 동일)
  black:    { second: 20.0000, third: 5.0000 }     # .../cube/black (등급 무관 동일)
  additional:                                       # .../cube/addi  (등급별로 다름)
    second: { rare: 1.9608, epic: 4.7619, unique: 1.9608, legendary: 0.4975 }
    third:  { rare: 1.9608, epic: 4.7619, unique: 1.9608, legendary: 0.4975 }

