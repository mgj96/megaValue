# 신규 큐브(골드/실버/브론즈 에디셔널): 옵션/등급 상승 확률이 명장/장인/수상한 에디셔널과 동일(보장 시스템 없음)
#   출처: https://m.maplestory.nexon.com/News/Update/799

version: draft-2026-10-18

# 등급 상승 확률 (%)
grade_up:
