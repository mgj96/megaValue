    rare_to_epic: 6.0000002444
    epic_to_unique: 1.8000
    unique_to_legendary: 0.3000
  black:    # https://maplestory.nexon.com/Guide/OtherProbability/cube/black
    rare_to_epic: 15.0000001275
    epic_to_unique: 3.5000
    unique_to_legendary: 1.4000
  additional:   # https://maplestory.nexon.com/Guide/OtherProbability/cube/addi  (에디셔널 큐브 / 화이트 에디셔널 큐브 열)
