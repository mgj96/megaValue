name: Docker Build & Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:    # 수동 트리거 가능

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ghcr.io/mgj96/megavalue

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR push 권한

    steps:
      # ─── 소스 체크아웃 ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Docker Buildx (멀티플랫폼 + BuildKit 캐시) ──────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── GHCR 로그인 (GITHUB_TOKEN 자동 제공) ────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── 이미지 태그 생성 (latest + sha-xxxx) ────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # ─── 빌드 & 푸시 ────────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 캐시로 재빌드 속도 향상
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=postgresql://user:pass@localhost:5432/db
            GOOGLE_ADS_TXT_CONTENT=${{ secrets.GOOGLE_ADS_TXT_CONTENT }}
            NEXT_PUBLIC_POTENTIAL_DATA_VERSION=${{ vars.NEXT_PUBLIC_POTENTIAL_DATA_VERSION || '1' }}
            NEXT_PUBLIC_LOG_VERSION=${{ vars.NEXT_PUBLIC_LOG_VERSION || '1' }}
            NEXT_PUBLIC_GOOGLE_ADSENSE_ACCOUNT=${{ secrets.NEXT_PUBLIC_GOOGLE_ADSENSE_ACCOUNT }}
            GA4_ID=${{ secrets.GA4_ID }}
